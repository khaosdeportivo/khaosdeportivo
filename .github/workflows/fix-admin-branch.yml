name: Fix admin branch
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace principal with main
        run: |
          if grep -q "branch: 'principal'" admin.html; then
            sed -i "s/branch: 'principal'/branch: 'main'/g" admin.html
            echo "Fixed principal → main"
          else
            echo "Already using main or pattern not found"
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --staged --quiet || git commit -m "Fix: GitHub sync branch principal → main"
          git push
