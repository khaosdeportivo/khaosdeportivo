<style>
:root {
  --gold:#D4AF37;--gold-light:#F0D878;--gold-dim:#B8960C;--gold-glow:rgba(212,175,55,0.15);
  --void:#050505;--ink:#0a0a0a;--charcoal:#111;--graphite:#141414;--slate:#1a1a1a;--stone:#222;--ash:#333;--fog:#555;--mist:#888;--silver:#b0b0b0;--pearl:#d0d0d0;--ivory:#f5f5f5;--white:#fff;
  --danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--info:#3b82f6;
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.4);--shadow-md:0 8px 32px rgba(0,0,0,0.5);--shadow-lg:0 16px 48px rgba(0,0,0,0.6);
  --shadow-gold:0 4px 24px rgba(212,175,55,0.2);--shadow-gold-lg:0 8px 40px rgba(212,175,55,0.3);
  --ease:cubic-bezier(0.4,0,0.2,1);--ease-bounce:cubic-bezier(0.34,1.56,0.64,1);--ease-expo:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"]{--void:#f8f9fa;--ink:#fff;--charcoal:#f1f3f5;--graphite:#fff;--slate:#f8f9fa;--stone:#e9ecef;--ash:#dee2e6;--fog:#adb5bd;--mist:#6c757d;--silver:#495057;--pearl:#343a40;--ivory:#212529;--white:#1a1a1a;--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 8px 32px rgba(0,0,0,0.08);--shadow-lg:0 16px 48px rgba(0,0,0,0.1);}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--void);color:var(--ivory);min-height:100vh;line-height:1.6;overflow-x:hidden}
body.cart-open{overflow:hidden;position:fixed;width:100%;height:100%}
::selection{background:var(--gold);color:var(--void)}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--void);padding-top:0}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 50%,rgba(212,175,55,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 30% 70%,rgba(212,175,55,0.05) 0%,transparent 50%),linear-gradient(180deg,var(--void) 0%,var(--ink) 40%,var(--charcoal) 100%);z-index:1}
.hero-particles{position:absolute;inset:0;z-index:0;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--gold);border-radius:50%;opacity:0;animation:pf 8s infinite ease-in-out}
@keyframes pf{0%,100%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:.6}90%{opacity:.6}50%{transform:translateY(-10vh) scale(1)}}
.hero-content{position:relative;z-index:2;text-align:center;padding:100px 24px 120px;max-width:900px;animation:hfi 1.2s var(--ease-expo) forwards;opacity:0}
@keyframes hfi{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.2);border-radius:50px;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:32px;margin-top:-20px;animation:hbi 1s var(--ease-expo) .3s forwards;opacity:0}
@keyframes hbi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.pulse-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(212,175,55,0.4)}50%{opacity:.6;box-shadow:0 0 0 8px rgba(212,175,55,0)}}
.hero-title{font-family:var(--font-display);font-size:clamp(2.5rem,7vw,5.5rem);font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:20px;background:linear-gradient(135deg,var(--white) 0%,var(--gold-light) 50%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-title-accent{display:block;font-size:clamp(.9rem,2vw,1.1rem);font-weight:500;letter-spacing:6px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;opacity:.9}
.hero-subtitle{font-size:clamp(1rem,2vw,1.2rem);color:var(--mist);max-width:560px;margin:0 auto 40px;line-height:1.7;font-weight:400}
.hero-cta-group{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:60px}
.btn-hero{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:var(--r-xl);font-family:var(--font-body);font-weight:800;font-size:14px;letter-spacing:.5px;text-decoration:none;cursor:pointer;transition:all .4s var(--ease);border:none;position:relative;overflow:hidden}
.btn-hero-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);box-shadow:var(--shadow-gold)}
.btn-hero-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .6s ease}
.btn-hero-primary:hover::before{left:100%}
.btn-hero-primary:hover{transform:translateY(-3px);box-shadow:var(--shadow-gold-lg)}
.btn-hero-secondary{background:transparent;color:var(--ivory);border:2px solid var(--ash)}
.btn-hero-secondary:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px);box-shadow:0 4px 20px rgba(212,175,55,0.1)}
.hero-stats{display:flex;gap:48px;justify-content:center;flex-wrap:wrap;animation:hfi 1s var(--ease-expo) .6s forwards;opacity:0}
.hero-stat{text-align:center}
.hero-stat-number{font-family:var(--font-display);font-size:2.5rem;font-weight:800;color:var(--gold);line-height:1}
.hero-stat-label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--fog);margin-top:6px}
.hero-scroll{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fog);font-size:11px;letter-spacing:2px;text-transform:uppercase;animation:hfi 1s var(--ease-expo) 1s forwards;opacity:0;cursor:pointer;transition:color .3s}
.hero-scroll:hover{color:var(--gold)}
.hero-scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--gold),transparent);animation:sb 2s infinite}
@keyframes sb{0%,100%{transform:scaleY(1);opacity:1}50%{transform:scaleY(.5);opacity:.5}}

/* NAV */
.nav-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between;background:transparent;transition:all .4s var(--ease)}
.nav-header.scrolled{background:rgba(5,5,5,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,175,55,0.08);height:64px}
[data-theme="light"] .nav-header.scrolled{background:rgba(255,255,255,0.85);border-bottom:1px solid rgba(0,0,0,0.06)}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-logo-mark{width:40px;height:40px;border-radius:12px;object-fit:cover;display:block;box-shadow:0 2px 12px rgba(212,175,55,0.3);transition:transform .3s var(--ease-bounce);animation:glowPulse 3s ease-in-out infinite}

.nav-logo:hover .nav-logo-mark{transform:scale(1.1) rotate(-5deg)}
@keyframes glowPulse{0%,100%{box-shadow:0 2px 12px rgba(212,175,55,0.3),0 0 20px rgba(212,175,55,0.1)}50%{box-shadow:0 2px 16px rgba(212,175,55,0.5),0 0 35px rgba(212,175,55,0.2)}}

  .nav-logo-text{font-family:var(--font-display);font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.nav-logo-sub{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--fog);margin-top:-2px}
.nav-center{display:flex;align-items:center;gap:8px}
.nav-link{padding:8px 16px;color:var(--silver);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.3px;border-radius:var(--r-md);transition:all .3s var(--ease);position:relative}
.nav-link::after{content:'';position:absolute;bottom:2px;left:50%;width:0;height:2px;background:var(--gold);border-radius:2px;transition:all .3s var(--ease);transform:translateX(-50%)}
.nav-link:hover{color:var(--white)}
.nav-link:hover::after{width:60%}
.nav-link.active{color:var(--gold)}
.nav-link.active::after{width:60%}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--stone);background:var(--charcoal);color:var(--silver);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease);font-size:16px;position:relative}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--slate);transform:translateY(-2px)}
.nav-badge{position:absolute;top:-2px;right:-2px;width:18px;height:18px;background:var(--danger);color:white;font-size:10px;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--charcoal)}
.nav-cart-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);border:none;border-radius:var(--r-xl);font-family:var(--font-body);font-weight:800;font-size:13px;cursor:pointer;transition:all .3s var(--ease);box-shadow:var(--shadow-gold)}
.nav-cart-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-gold-lg)}
.mega-menu{position:fixed;top:72px;left:0;right:0;background:rgba(10,10,10,0.95);backdrop-filter:blur(30px);border-bottom:1px solid rgba(212,175,55,0.1);padding:40px 0;z-index:99;opacity:0;visibility:hidden;transform:translateY(-10px);transition:all .4s var(--ease)}
.mega-menu.active{opacity:1;visibility:visible;transform:translateY(0)}
.mega-menu-grid{max-width:1200px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.mega-menu-col h4{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--stone)}
.mega-menu-item{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--silver);text-decoration:none;font-size:13px;font-weight:500;transition:all .2s;cursor:pointer;border:none;background:none;font-family:inherit;width:100%;text-align:left}
.mega-menu-item:hover{color:var(--gold);padding-left:8px}
.mega-menu-item-icon{width:36px;height:36px;border-radius:10px;background:var(--slate);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.mega-menu-item:hover .mega-menu-item-icon{background:var(--gold-glow);color:var(--gold)}
.mobile-menu-btn{display:none;width:42px;height:42px;border-radius:var(--r-md);border:1px solid var(--stone);background:var(--charcoal);color:var(--silver);cursor:pointer;font-size:18px;align-items:center;justify-content:center}
.mobile-drawer{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100vh;background:var(--ink);border-left:1px solid var(--stone);z-index:300;transition:right .5s var(--ease-expo);overflow-y:auto;padding:24px}
.mobile-drawer.open{right:0}
.mobile-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:299;opacity:0;visibility:hidden;transition:all .3s}
.mobile-drawer-overlay.active{opacity:1;visibility:visible}

/* TRUST */
.trust-bar{background:var(--charcoal);border-top:1px solid var(--stone);border-bottom:1px solid var(--stone);padding:20px 0;position:relative;z-index:10}
.trust-grid{max-width:1200px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.trust-item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);transition:all .3s}
.trust-item:hover{background:var(--slate)}
.trust-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-glow);border:1px solid rgba(212,175,55,0.15);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.trust-text h4{font-size:13px;font-weight:700;color:var(--ivory);margin-bottom:2px}
.trust-text p{font-size:11px;color:var(--fog);font-weight:500}

/* CATALOG */
.catalog-section{max-width:1400px;margin:0 auto;padding:60px 32px 80px}
.catalog-header{text-align:center;margin-bottom:48px}
.catalog-header h2{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;color:var(--white);margin-bottom:12px}
.catalog-header p{color:var(--fog);font-size:15px;max-width:500px;margin:0 auto}
.catalog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap;padding:20px 24px;background:var(--charcoal);border:1px solid var(--stone);border-radius:var(--r-lg)}
.search-box{position:relative;flex:1;min-width:260px;max-width:400px}
.search-box input{width:100%;padding:14px 44px 14px 48px;background:var(--graphite);border:1px solid var(--stone);border-radius:var(--r-xl);color:var(--ivory);font-family:var(--font-body);font-size:14px;font-weight:500;outline:none;transition:all .3s}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow)}
.search-box input::placeholder{color:var(--fog)}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--fog)}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--ash);border:none;color:var(--ivory);width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .2s}
.search-clear.show{display:flex}
.search-clear:hover{background:var(--danger)}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:10px 20px;background:var(--graphite);border:1px solid var(--stone);border-radius:50px;color:var(--silver);font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .3s var(--ease);white-space:nowrap}
.filter-chip:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.filter-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);border-color:var(--gold);box-shadow:var(--shadow-gold)}
.sort-dropdown{position:relative}
.sort-btn{padding:12px 20px;background:var(--graphite);border:1px solid var(--stone);border-radius:var(--r-xl);color:var(--silver);font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .3s}
.sort-btn:hover{border-color:var(--gold);color:var(--gold)}
.sort-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--graphite);border:1px solid var(--stone);border-radius:var(--r-md);padding:8px;min-width:200px;z-index:50;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .25s var(--ease);box-shadow:var(--shadow-lg)}
.sort-dropdown.open .sort-menu{opacity:1;visibility:visible;transform:translateY(0)}
.sort-option{display:block;width:100%;padding:10px 14px;background:none;border:none;color:var(--silver);font-family:var(--font-body);font-size:13px;font-weight:600;text-align:left;border-radius:var(--r-sm);cursor:pointer;transition:all .2s}
.sort-option:hover{background:var(--gold-glow);color:var(--gold)}
.sort-option.active{background:var(--gold-glow);color:var(--gold)}
.results-info{font-size:13px;color:var(--fog);margin-bottom:24px;font-weight:500}
.results-info span{color:var(--gold);font-weight:700}

/* PRODUCTS */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.product-card{background:var(--charcoal);border:1px solid var(--stone);border-radius:var(--r-lg);overflow:hidden;transition:all .5s var(--ease);cursor:pointer;position:relative;animation:cr .6s var(--ease-expo) forwards;opacity:0;transform:translateY(30px)}
@keyframes cr{to{opacity:1;transform:translateY(0)}}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));opacity:0;transition:opacity .4s}
.product-card:hover{transform:translateY(-8px);border-color:rgba(212,175,55,0.3);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(212,175,55,0.05)}
.product-card:hover::before{opacity:1}
.product-card-badge{position:absolute;top:16px;left:16px;z-index:3;padding:6px 14px;border-radius:50px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(10px)}
.product-card-badge.bestseller{background:linear-gradient(135deg,rgba(239,68,68,0.9),rgba(220,38,38,0.9));color:white;animation:bp 2s infinite}
.product-card-badge.new{background:linear-gradient(135deg,rgba(34,197,94,0.9),rgba(22,163,74,0.9));color:white}
@keyframes bp{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.product-card-img-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center}
.product-card-img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.product-card:hover .product-card-img{transform:scale(1.08)}
.product-card-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,5,0.9) 0%,transparent 50%);opacity:0;transition:opacity .4s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px}
.product-card:hover .product-card-img-overlay{opacity:1}
.product-card-quick-btn{padding:12px 28px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);border:none;border-radius:var(--r-xl);font-family:var(--font-body);font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer;transform:translateY(20px);opacity:0;transition:all .4s var(--ease-expo);box-shadow:var(--shadow-gold)}
.product-card:hover .product-card-quick-btn{transform:translateY(0);opacity:1}
.product-card-quick-btn:hover{transform:translateY(0) scale(1.05);box-shadow:var(--shadow-gold-lg)}
.product-card-info{padding:22px}
.product-card-category{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.product-card-name{font-size:16px;font-weight:700;color:var(--white);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card-code{font-size:11px;color:var(--fog);font-family:'Courier New',monospace;margin-bottom:14px}
.product-card-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.product-card-price{font-size:22px;font-weight:900;color:var(--gold-light);line-height:1}
.product-card-old-price{font-size:14px;color:var(--fog);text-decoration:line-through;font-weight:500}
.product-card-discount{font-size:11px;font-weight:800;color:var(--danger);background:rgba(239,68,68,0.1);padding:2px 8px;border-radius:20px}
.product-card-sizes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.size-pill{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;font-family:'Courier New',monospace;transition:all .2s}
.size-pill.available{background:var(--slate);color:var(--silver);border:1px solid var(--ash)}
.size-pill.out{opacity:.35;text-decoration:line-through;background:var(--slate);color:var(--fog);border:1px solid var(--stone)}
.product-card-actions{display:flex;gap:10px}
.btn-card-primary{flex:1;padding:12px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);border:none;border-radius:var(--r-md);font-family:var(--font-body);font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-card-primary:hover{transform:scale(1.02);box-shadow:var(--shadow-gold)}

.modal-actions{display:flex;gap:12px;margin-top:24px}
.modal-btn{flex:1;padding:16px;border-radius:var(--r-md);border:none;font-family:var(--font-body);font-weight:800;font-size:14px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px}

/* CART */
.cart-float{position:fixed;bottom:28px;right:28px;z-index:150;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--void);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;box-shadow:0 6px 30px rgba(212,175,55,0.4);transition:all .4s var(--ease)}

@media(max-width:768px){.nav-header{padding:0 16px;height:64px}.nav-right .nav-btn:not(.nav-cart-btn){display:none}.mobile-menu-btn{display:flex}.hero-stats{gap:24px}.hero-stat-number{font-size:1.8rem}.trust-grid{grid-template-columns:1fr}.catalog-toolbar{flex-direction:column;align-items:center;gap:16px;padding:16px}.search-box{max-width:100%;width:100%}.filter-chips{justify-content:center;width:100%}.sort-dropdown{align-self:flex-end;margin-top:8px}.products-grid{grid-template-columns:repeat(2,1fr);gap:16px}.catalog-section{padding:40px 16px 60px}.footer-grid{grid-template-columns:1fr;gap:32px}.footer-bottom{flex-direction:column;text-align:center}.cart-panel{max-width:100%}.mega-menu{display:none!important}}

.coupon-toggle-arrow.open{transform:rotate(180deg);color:var(--gold)}
.coupon-body{padding:8px 0 0 0;animation:couponSlide .3s var(--ease)}
@keyframes couponSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.coupon-input-wrap{display:flex;gap:8px;margin-bottom:8px}
.coupon-input{flex:1;padding:10px 14px;background:var(--graphite);border:1px solid var(--stone);border-radius:var(--r-md);color:var(--ivory);font-family:var(--font-body);font-size:16px;font-weight:700;outline:none;transition:all .3s;text-transform:uppercase}
.coupon-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.coupon-input::placeholder{color:var(--fog);text-transform:none;font-weight:500}
.coupon-btn{padding:10px 18px;background:var(--slate);border:1px solid var(--ash);border-radius:var(--r-md);color:var(--silver);font-family:var(--font-body);font-size:12px;font-weight:800;cursor:pointer;transition:all .3s;white-space:nowrap}
.coupon-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.coupon-info{font-size:12px;font-weight:600;padding:8px 12px;border-radius:var(--r-sm);display:none;align-items:center;gap:6px}
.coupon-info.show{display:flex}
.coupon-info.success{background:rgba(34,197,94,0.1);color:var(--success);border:1px solid rgba(34,197,94,0.2)}
.coupon-info.error{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2)}
.coupon-info.warning{background:rgba(245,158,11,0.1);color:var(--warning);border:1px solid rgba(245,158,11,0.2)}
.coupon-applied{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--gold-glow);border:1px solid rgba(212,175,55,0.2);border-radius:var(--r-md);margin-bottom:8px;margin-top:8px}
.coupon-applied-code{font-family:'Courier New',monospace;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px}
.coupon-applied-value{font-size:12px;font-weight:700;color:var(--success)}
.coupon-remove{background:none;border:none;color:var(--fog);font-size:14px;cursor:pointer;padding:4px;transition:all .2s;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.coupon-remove:hover{color:var(--danger);background:rgba(239,68,68,0.1)}
.coupon-hint{font-size:11px;color:var(--fog);margin-top:8px;line-height:1.5;display:none}
.coupon-hint.show{display:block}
.img-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:0.3;pointer-events:none;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.cart-discount{display:none;justify-content:space-between;margin-bottom:8px;font-size:14px}
.cart-discount.show{display:flex}
.cart-discount-label{color:var(--success);font-weight:700}
.cart-discount-value{color:var(--success);font-weight:800}
.mobile-accordion-btn{width:100%;padding:12px 16px;background:var(--charcoal);border:1px solid var(--stone);border-radius:var(--r-md);color:var(--ivory);font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .3s var(--ease);margin-top:4px}
.mobile-accordion-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.mobile-accordion-btn[aria-expanded="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.mobile-accordion-btn[aria-expanded="true"] .mobile-accordion-arrow{transform:rotate(180deg)}
.mobile-accordion-arrow{transition:transform .3s var(--ease);color:var(--silver);flex-shrink:0}
.mobile-accordion-btn:hover .mobile-accordion-arrow{color:var(--gold)}
.mobile-accordion-panel{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 8px;animation:accordionSlide .3s var(--ease)}
.mobile-accordion-panel a{border-radius:var(--r-sm)!important}
.mobile-accordion-panel a:hover{background:var(--gold-glow)!important;color:var(--gold)!important}
@keyframes accordionSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.size-option.out-of-stock small{font-size:9px;font-weight:500;color:var(--fog)}
</style>
</head>
