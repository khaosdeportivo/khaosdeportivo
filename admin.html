<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaos Deportivo — Panel de Administracion</title>
<style>
  body{margin:0;background:#0f0f14;color:#eee;font-family:system-ui,sans-serif}
  #boot{padding:40px;text-align:center}
  .spin{width:40px;height:40px;border:3px solid #333;border-top-color:#f5c518;border-radius:50%;margin:20px auto;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><p>Cargando panel…</p></div>
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/khaosdeportivo/khaosdeportivo@0c971526acc7/';
  fetch(BASE + 'admin.html?t=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
      var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (!bodyMatch) throw new Error('No body');
      if (headMatch) {
        var tmp = document.createElement('div');
        tmp.innerHTML = headMatch[1];
        Array.prototype.slice.call(tmp.querySelectorAll('link,style,meta')).forEach(function (el) {
          document.head.appendChild(el.cloneNode(true));
        });
        var title = tmp.querySelector('title');
        if (title) document.title = title.textContent;
        var chart = document.createElement('script');
        chart.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
        document.head.appendChild(chart);
      }
      var bodyHtml = bodyMatch[1]
        .replace(/src=["']js\/admin\.js["']/g, 'src="' + BASE + 'js/admin.js"')
        .replace(/src=["']js\/admin-categories\.js["']/g, 'src="js/admin-categories.js?v=2"')
        .replace(/src=["']js\/admin-promo-gift\.js["']/g, 'src="js/admin-promo-gift.js?v=2"');
      document.body.innerHTML = bodyHtml;
      var list = Array.prototype.slice.call(document.body.querySelectorAll('script'));
      function runNext(i) {
        if (i >= list.length) {
          var core = document.createElement('script');
          core.src = 'js/khaos-admin-core.js?v=4';
          core.onload = function () {
            var filters = document.createElement('script');
            filters.src = 'js/khaos-admin-filters.js?v=3';
            filters.onload = function () {
              var view = document.createElement('script');
              view.src = 'js/khaos-admin-view.js?v=1';
              document.body.appendChild(view);
            };
            document.body.appendChild(filters);
          };
          document.body.appendChild(core);
          return;
        }
        var old = list[i];
        var s = document.createElement('script');
        if (old.src) {
          s.src = old.src;
          s.onload = function () { runNext(i + 1); };
          s.onerror = function () { console.warn('script fail', old.src); runNext(i + 1); };
          old.parentNode.replaceChild(s, old);
        } else {
          s.textContent = old.textContent;
          old.parentNode.replaceChild(s, old);
          runNext(i + 1);
        }
      }
      runNext(0);
    })
    .catch(function (err) {
      var el = document.getElementById('boot');
      if (el) el.innerHTML = '<h1>Error cargando el panel</h1><p>' + err + '</p><p>Ctrl+F5 para reintentar</p>';
    });
})();
</script>
</body>
</html>
