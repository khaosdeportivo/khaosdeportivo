<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaos Deportivo — Panel de Administración</title>
<style>
  body{margin:0;background:#0f0f14;color:#eee;font-family:system-ui,sans-serif}
  #boot{padding:40px;text-align:center}
  .spin{width:40px;height:40px;border:3px solid #333;border-top-color:#f5c518;border-radius:50%;margin:20px auto;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><p>Cargando panel…</p></div>
<script>
(function(){
  var BASE = 'https://cdn.jsdelivr.net/gh/khaosdeportivo/khaosdeportivo@0c971526acc7/';
  fetch(BASE + 'admin.html?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
      var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if(!bodyMatch) throw new Error('No body');
      if(headMatch){
        var tmp = document.createElement('div');
        tmp.innerHTML = headMatch[1];
        Array.prototype.slice.call(tmp.querySelectorAll('link,style,meta')).forEach(function(el){
          document.head.appendChild(el.cloneNode(true));
        });
        var title = tmp.querySelector('title');
        if(title) document.title = title.textContent;
        var chart = document.createElement('script');
        chart.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
        document.head.appendChild(chart);
      }
      var bodyHtml = bodyMatch[1].replace(/src=["']js\/admin\.js["']/g, 'src="'+BASE+'js/admin.js"');
      document.body.innerHTML = bodyHtml;
      var list = Array.prototype.slice.call(document.body.querySelectorAll('script'));
      function runNext(i){
        if(i>=list.length){
          // UI productos estilo maestro
          var ui = document.createElement('script');
          ui.src = 'js/admin-products-ui.js?t=' + Date.now();
          document.body.appendChild(ui);

          // ===== Parches de estabilidad =====
          (function installPatches(){
            var tries = 0;
            function tryPatch(){
              // 1) Auto-sync al guardar
              if (typeof window.saveProducts === 'function' && !window.__khaosAutoSyncInstalled) {
                window.__khaosAutoSyncInstalled = true;
                var _origSave = window.saveProducts;
                var timer = null;
                window.saveProducts = function(){
                  var r = _origSave.apply(this, arguments);
                  try {
                    var token = '';
                    try { token = localStorage.getItem('khaos_github_token') || ''; } catch(e){}
                    if (!token || (!token.startsWith('ghp_') && !token.startsWith('github_pat_'))) {
                      if (typeof showToast === 'function') {
                        showToast('Guardado local. Configura el token de GitHub en Ajustes para actualizar el catálogo.', 'warning');
                      }
                      return r;
                    }
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(function(){
                      timer = null;
                      if (typeof syncToGithub === 'function') {
                        console.log('[Khaos] Auto-sync a GitHub…');
                        syncToGithub();
                      }
                    }, 1500);
                  } catch(e) { console.warn('[Khaos] auto-sync error', e); }
                  return r;
                };
                console.log('[Khaos] Auto-sync instalado');
              }

              // 2) updateCouponStats null-safe (evita error textContent de null)
              if (typeof window.updateCouponStats === 'function' && !window.__khaosCouponPatch) {
                window.__khaosCouponPatch = true;
                var _origCoupon = window.updateCouponStats;
                window.updateCouponStats = function(){
                  try {
                    var ids = ['couponTotal','couponActive','couponUsed','couponSaved',
                               'sidebarCouponCount','tabCouponAll','tabCouponActive',
                               'tabCouponExpired','tabCouponPct','tabCouponFixed'];
                    var missing = ids.some(function(id){ return !document.getElementById(id); });
                    if (missing) return; // vista de cupones aún no montada
                    return _origCoupon.apply(this, arguments);
                  } catch(e) {
                    console.warn('[Khaos] updateCouponStats seguro:', e.message);
                  }
                };
              }

              // 3) formatPrice seguro
              if (typeof window.formatPrice !== 'function') {
                window.formatPrice = function(n){
                  n = Number(n);
                  if (isNaN(n)) n = 0;
                  return '$' + n.toLocaleString('es-CO');
                };
              }

              if (window.__khaosAutoSyncInstalled && window.__khaosCouponPatch) return;
              if (++tries < 50) setTimeout(tryPatch, 200);
            }
            tryPatch();
          })();

          // ===== PRODUCTOS: siempre prioritizar GitHub =====
          setTimeout(function(){
            function normalize(list){
              return (list || []).map(function(p){
                if (!p || typeof p !== 'object') return null;
                if (!Array.isArray(p.sizes)) p.sizes = [];
                if (!Array.isArray(p.outOfStock)) p.outOfStock = [];
                p.price = Number(p.price);
                if (isNaN(p.price)) p.price = 0;
                if (p.oldPrice != null) {
                  p.oldPrice = Number(p.oldPrice);
                  if (isNaN(p.oldPrice) || p.oldPrice <= 0) p.oldPrice = null;
                } else {
                  p.oldPrice = null;
                }
                if (typeof p.name !== 'string') p.name = String(p.name || 'Sin nombre');
                if (typeof p.code !== 'string') p.code = String(p.code || '');
                if (typeof p.category !== 'string') p.category = 'guayo-corto';
                if (typeof p.image !== 'string') p.image = '';
                return p;
              }).filter(Boolean);
            }

            function apply(list, source){
              list = normalize(list);
              if (!list.length) {
                console.warn('[Khaos] lista vacía desde', source);
                return false;
              }
              window.products = list;
              try {
                nextId = Math.max.apply(null, list.map(function(x){ return x.id || 0; }).concat([0])) + 1;
              } catch(e) {}
              try {
                localStorage.setItem('khaos_admin_products', JSON.stringify(list));
              } catch(e) {}

              try { if (typeof currentTab !== 'undefined') currentTab = 'all'; } catch(e) {}
              try { if (typeof currentCategoryFilter !== 'undefined') currentCategoryFilter = 'all'; } catch(e) {}
              try { if (typeof currentPage !== 'undefined') currentPage = 1; } catch(e) {}
              try { if (typeof selectedIds !== 'undefined' && selectedIds.clear) selectedIds.clear(); } catch(e) {}

              try { if (typeof renderTable === 'function') renderTable(); } catch(e) { console.warn(e); }
              try { if (typeof updateAllStats === 'function') updateAllStats(); } catch(e) { console.warn(e); }
              try { if (typeof updateDashboard === 'function') updateDashboard(); } catch(e) { console.warn(e); }
              try { if (typeof renderSidebarCategories === 'function') renderSidebarCategories(); } catch(e) {}
              try { if (typeof renderCategoryChips === 'function') renderCategoryChips(); } catch(e) {}
              try { if (typeof renderInventory === 'function') renderInventory(); } catch(e) {}
              try { if (typeof updateCharts === 'function') updateCharts(); } catch(e) {}

              console.log('[Khaos] productos cargados (' + source + '):', list.length);
              if (typeof showToast === 'function') {
                showToast('Catálogo cargado: ' + list.length + ' productos', 'success');
              }
              return true;
            }

            fetch('https://cdn.jsdelivr.net/gh/khaosdeportivo/khaosdeportivo@main/productos.json?t=' + Date.now(), { cache: 'no-store' })
              .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(function(d){
                var list = Array.isArray(d) ? d : (d.productos || []);
                if (!apply(list, 'github')) throw new Error('GitHub sin productos');
              })
              .catch(function(err){
                console.warn('[Khaos] GitHub falló, usando localStorage:', err);
                try {
                  var s = localStorage.getItem('khaos_admin_products');
                  if (s) {
                    var p = JSON.parse(s);
                    if (Array.isArray(p) && p.length > 0) {
                      apply(p, 'localStorage');
                      return;
                    }
                  }
                } catch(e) {}
                console.warn('[Khaos] Sin productos disponibles');
              });
          }, 900);
          return;
        }
        var old=list[i];
        var s=document.createElement('script');
        if(old.src){
          s.src=old.src;
          s.onload=function(){ runNext(i+1); };
          s.onerror=function(){ console.warn('script fail', old.src); runNext(i+1); };
          old.parentNode.replaceChild(s, old);
        } else {
          s.textContent=old.textContent;
          old.parentNode.replaceChild(s, old);
          runNext(i+1);
        }
      }
      runNext(0);
    })
    .catch(function(err){
      var el=document.getElementById('boot');
      if(el) el.innerHTML='<h1>Error cargando el panel</h1><p>'+err+'</p><p>Ctrl+F5 para reintentar</p>';
    });
})();
</script>
</body>
</html>
