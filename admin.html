<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Khaos Deportivo — Panel de Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="scroll-indicator" id="scrollIndicator"></div>

<div class="login-screen" id="loginScreen">
    <div class="login-bg"><div class="login-particles" id="loginParticles"></div></div>
    <div class="login-card">
        <div class="login-logo">K</div>
        <h1>Khaos Deportivo</h1>
        <p>Panel de Administración</p>
        <div class="login-form">
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" class="form-input" id="loginPassword" placeholder="Ingresa tu contraseña" onkeypress="if(event.key==='Enter'){event.preventDefault();doLogin();}">
            </div>
            <div class="login-error" id="loginError">Contraseña incorrecta. Intenta de nuevo.</div>
            <button type="button" class="btn btn-primary login-btn" onclick="doLogin()"><i class="fas fa-lock"></i> Acceder al Panel</button>
        </div>
        <div class="login-hint" style="display:none;"></div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text">Cargando...</div></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>

<!-- HOTFIX LOADER: if full admin.html update fails, this minimal page still loads core + hotfix -->
<script src="js/admin-a.js"></script>
<script src="js/admin-b.js"></script>
<script src="js/admin-categories.js"></script>
<script src="js/admin-promo-gift.js"></script>
<script src="js/admin-hotfix.js"></script>
<script>
alert('admin.html quedó incompleto por un error de subida. Restaura admin.html desde GitHub history (commit dd6a9c5) y agrega solo: <script src=\"js/admin-hotfix.js\"><\/script> antes de <\/body>');
</script>
</body>
</html>
