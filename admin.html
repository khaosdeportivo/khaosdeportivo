<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaos Deportivo — Panel de Administración</title>
</head>
<body>
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/khaosdeportivo/khaosdeportivo@0c971526acc7/';
  fetch(BASE + 'admin.html?t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (html) {
      html = html.replace(
        /src=["']js\/admin\.js["']/, 
        'src="' + BASE + 'js/admin.js"'
      );
      // Inyectar auto-carga de productos tras el admin.js
      var inject = '<script>(function(){function fill(){try{var s=localStorage.getItem("khaos_admin_products");if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length>0)return;}}catch(e){}fetch("https://raw.githubusercontent.com/khaosdeportivo/khaosdeportivo/main/productos.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(data){var list=Array.isArray(data)?data:(data.productos||[]);if(!list.length||typeof products==="undefined")return;products=list;if(typeof nextId!=="undefined")nextId=Math.max.apply(null,list.map(function(x){return x.id||0}).concat([0]))+1;if(typeof saveProducts==="function")saveProducts();if(typeof renderTable==="function")renderTable();if(typeof updateAllStats==="function")updateAllStats();if(typeof showToast==="function")showToast(list.length+" productos cargados","success");}).catch(function(){});}setTimeout(fill,800);})();<\/script>';
      html = html.replace('</body>', inject + '</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;background:#111;color:#fff;min-height:100vh">' +
        '<h1>Error cargando el panel</h1><p>' + String(err) + '</p>' +
        '<p>Recarga con Ctrl+F5.</p></div>';
    });
})();
</script>
</body>
</html>
